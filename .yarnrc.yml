enableScripts: false
nmMode: hardlinks-global
nodeLinker: node-modules
npmMinimalAgeGate: 3d

npmPreapprovedPackages:
  - '@oxfmt/binding-*@0.43.0'
  - '@oxlint/binding-*@1.58.0'
  - '@rspack/binding*@1.7.11'
  - '@rspack/cli@1.7.11'
  - '@rspack/core@1.7.11'
  - '@tanstack/form-*'
  - '@tanstack/query-*'
  - '@tanstack/react-*'
  - '@tanstack/router-*'
  - '@tanstack/start-*'
  - '@voidzero-dev/vite-plus-*@0.1.15'
  - '@xcamp/config@2026.3.12'
  - oxfmt@0.43.0
  - oxlint@1.58.0
  - vite-plus@0.1.15

catalogs:
  orpc:
    '@orpc/client': 1.13.13
    '@orpc/server': 1.13.13
    '@orpc/standard-server-peer': 1.13.13
    '@orpc/tanstack-query': 1.13.13
  validation:
    zod: 4.3.6
